name: Release

# Push a tag like v0.2.0 to build, sign, notarize and publish HoTty, then update the
# Homebrew cask in justanotheratom/homebrew-tap. Uses the same secrets as ccw.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Write notarization key
        env:
          NOTARYTOOL_KEY: ${{ secrets.NOTARYTOOL_KEY }}
        run: echo "$NOTARYTOOL_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, notarize and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
          NOTARY_KEY_ID: ${{ secrets.NOTARYTOOL_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARYTOOL_ISSUER }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" ./scripts/release.sh "${GITHUB_REF_NAME#v}" --publish

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
